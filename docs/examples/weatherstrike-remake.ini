; ============================================================================
;  WeatherExt remake of the World Powers "Weather Strike" storm system
; ----------------------------------------------------------------------------
;  This reproduces the OLD auto-firing storm (SkirmishWeatherStrike + the
;  STRMTWRWH storm-damage warhead + the ~1,770 Game Options dial files) as a
;  single WeatherExt meter with a firing effect and a damage curve.
;
;  Status: uses P1 (meters + contributors, LIVE today) plus P2 (Fire.*) and
;  P3 (Versus.*), which are designed (DESIGN.md rev 2.1/2.2) but not yet built.
;  So this is the drop-in config the remake WILL use; the meter + contributor
;  half already runs. Nothing here needs a dummy building or a per-dial file.
; ============================================================================


; --- the meter: was 500 StartingLevel + 500 LowestLevel + 500 MaxLevel files -
[WeatherSystems]
0=WeatherStorm

[WeatherStorm]
StartAmount=0        ; <- one CnCNet dropdown sets this (see [cmbWeatherIntensity])
Min=0                ; was LowestLevelX.ini (500 files)
Max=25000            ; was MaxLevelX.ini (500 files)
Baseline=0           ; the storm calms toward 0 when nothing feeds it
Decay=5
DecayRate=15


; --- the auto-firing storm: was SkirmishWeatherStrike + the WeatherStrikeSW /
;     SkirmishWeatherStrike / lightningstorms / gradualLightningspace /
;     LightningMax / LightningMin banks (150+ files). The SW itself keeps only
;     its payload + presentation; WeatherExt owns WHEN and HOW OFTEN it fires. -
[WeatherStorm]
Fire.Types=WeatherStrike                 ; the existing SW type (payload below)
Fire.Amounts=2000                        ; storms begin once the meter passes 2000
Fire.Counts=1                            ; strikes per volley (was LightningMax/Min)
Fire.Intervals=150                       ; base frames between strikes (was RechargeTime dials)
Fire.IntervalStep=-2                     ; ...shrinking as the storm intensifies...
Fire.IntervalStepAmount=250              ; ...one step per 250 meter above onset (was gradualLightningspace)
Fire.IntervalMin=15                      ; never faster than this (safety floor)
Fire.Target=random                       ; SW.AITargeting=LightningRandom
Fire.Owner=neutral
; inhibitors/designators are honored automatically (fires through Fire_SW),
; so the old SW.Inhibitors=GAGAP on the storm still applies.


; --- storm damage that scales with the storm: was StormDamage*.ini (33 files),
;     each a frozen Verses row. Here they're keyframes of one curve the meter
;     sweeps. Armor columns are the mod's 11 base types, by NAME. --------------
[WeatherStorm]
Versus.Warheads=STRMTWRWH
Versus.STRMTWRWH.Keyframes=0,12500,25000
Versus.STRMTWRWH.Armors=none,flak,plate,light,medium,heavy,wood,steel,concrete,special_1,special_2
; keyframe rows taken straight from the real files:
;   row 0     = the base [STRMTWRWH] Verses
;   row 12500 = StormDamage015.ini (the 10x mid-storm snapshot)
;   row 25000 = doubled again for a max-storm apocalypse
Versus.STRMTWRWH.Row.0    =100%,100%,100%,85%,100%,100%,25%,25%,25%,200%,100%
Versus.STRMTWRWH.Row.12500=1000%,1000%,1000%,850%,1000%,1000%,250%,250%,250%,2000%,1000%
Versus.STRMTWRWH.Row.25000=2000%,2000%,2000%,1700%,2000%,2000%,500%,500%,500%,4000%,2000%
Versus.STRMTWRWH.Interp=linear           ; smooth ramp; use "step" for the old discrete behaviour


; --- what drives the storm up. Pick your feeders; a few examples: ------------

; every superweapon fired stirs the weather a little
[NukeSpecial]
WeatherSystem.Types=WeatherStorm
WeatherSystem.Amounts=1500

; ...and a nuke leaves a lingering storm: raise now, settle over ~40s (P2.2 pulse)
[NukeSpecial]
WeatherSystem.Amounts.Finish=-1500
WeatherSystem.Interval=1000

; reactors slowly heat the climate while powered (P1 - LIVE today)
[NANRCT]
WeatherSystem.Types=WeatherStorm
WeatherSystem.Amounts=3
WeatherSystem.Rate=15
WeatherSystem.RequiresPower=yes

; the demo truck's own warhead spikes it hard (P1 - LIVE today)
[DTKWH]
WeatherSystem.Types=WeatherStorm
WeatherSystem.Amounts=800


; --- the SW keeps ONLY its payload + look; no more AutoFire/RechargeTime/
;     AlwaysGranted/AuxBuilding scaffolding, no SKIRMISHNINJA grant building. --
[WeatherStrike]
UIName=NOSTR:Weather Strike
Name=Weather Strike
Type=MultiMissile
Action=Nuke
SidebarImage=NukeIcon
Nuke.SiloLaunch=no
Nuke.Payload=WeatherStrikePayload
SW.Warhead=STRMTWRWH
SW.Animation=dummySTRMintro;EXPLOLB;ZUESCLOUDSTG1
SW.ActivationSound=WeatherIntro
SW.Inhibitors=GAGAP
SW.ShowCameo=no


; --- CnCNet skirmish dial: ONE dropdown replaces the 500 StartingLevel files -
;  (client GameOptions.ini)
;  [cmbWeatherIntensity]
;  Items=Off,Calm,Stormy,Apocalypse
;  SpawnIniOption=WeatherStorm.StartAmount   ; e.g. 0 / 4000 / 12000 / 24000
;  -> WeatherExt reads [WeatherExt] from spawn.ini, layered over these rules.


; ============================================================================
;  Before  ->  after, just for this one storm:
;    StartingLevel* (500) + LowestLevel* (500) + MaxLevel* (500) -> 6 keys
;    recharge/lightning/gradual banks (150+)                     -> the Fire.* block
;    StormDamage* (33)                                           -> 3 keyframe rows
;    WeatherStormStep* dummy buildings + LimboDelivery ladders   -> deleted
;    SKIRMISHNINJA grant building + AuxBuildings                 -> deleted
;  ~1,700 files  ->  ~40 lines.
; ============================================================================
