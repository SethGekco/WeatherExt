; =============================================================================
; weatherStorm.ini, remade for WeatherExt (rev 4)
;
; The old file is 2,543 sections / 67,491 lines: 500 step buildings, 500 copies
; of one strike SW, 500 climb SWs, 500 decline buildings + SWs, and a spawner.
; This is the whole thing: ONE meter (the level), ONE pool (the strikes), and
; ONE strike SW. 1 old level = 10 Weight here, so contributors (nukes, warheads,
; reactors) can nudge the storm by less than a whole level.
; =============================================================================

[WeatherSystems]
0=WeatherStorm

[WeatherStrikes]
0=StormStrikes

; --- the level: replaces WeatherStormStep*, DecimationStep*, DeliverySW*,
;     DecimationSW*, the dummies, the filler and the spawner -----------------
[WeatherStorm]
StartAmount=100          ; old StartingLevel10
Min=0
Max=5000                 ; old level 500

Motion=climb             ; old StartDeliverySW. decline = StartDecimationSW,
                         ; stable = StartStable.ini, random = new
Motion.Delay=0           ; old InitialDelay*

Climb.Step=10            ; one old level per step
Climb.Every=0.1m         ; old DeliverySW_Recharge (RechargeTime minutes)
Climb.To=5000            ; old MaxLevel500
Climb.AtEnd=reverse      ; old DeliveryFiller turn-around

Decline.Step=10
Decline.Every=0.1m       ; old DecimationSW_Recharge
Decline.To=0             ; old LowestLevel0
Decline.AtEnd=reverse    ; old DecimationSW500 turn-around

; --- the strikes: replaces WeatherStrikeSW001-500 --------------------------
[StormStrikes]
Weight.Systems=WeatherStorm
Slots.PerWeight=10       ; one strike per old level (Weight 100 = 10 strikes)
Slots.Max=500
Slots.NewReady=yes       ; old SW.InitialReady=yes: a new level strikes at once

Recharge.Max=10m         ; old WeatherStrikeSW RechargeTime=10
                         ; (no Recharge.Min/Shave = every strike stays 10m,
                         ;  exactly like the old file)
Strike.SW=WeatherStrikeSW
Strike.PerFrame=2        ; never more than 2 strikes in one frame
Strike.Owner=each-human  ; the old file ran one ladder per human player;
                         ; set neutral for one shared storm

; --- the single strike SW (WeatherStrikeSW001 with the number dropped). Its
;     RechargeTime is ignored; WeatherExt fires it through Fire_SW, so
;     inhibitors, designators and SuperWeaponExt rules still apply. ----------
[SuperWeaponTypes]
; +=WeatherStrikeSW      ; add to the mod's own list

[WeatherStrikeSW]
IsPowered=false
RechargeTime=10
Type=MultiMissile
Action=Nuke
ShowTimer=no
DisableableFromShell=no
AIDefendAgainst=no
Range=7
LineMultiplier=2
Nuke.SiloLaunch=no
Nuke.Payload=WeatherStrikePayload
SW.Damage=0
SW.Warhead=STRMTWRWH
SW.Animation=dummySTRMintro
SW.ActivationSound=WeatherIntro
SW.Deferment=0
Light.Enabled=no
SW.ManualFire=no
SW.AutoFire=no           ; WeatherExt owns the cadence now
SW.AllowPlayer=no
SW.AllowAI=no
SW.ShowCameo=no
SW.TimerVisibility=none
SW.CreateRadarEvent=no
EVA.Detected=none
EVA.Activated=none
EVA.Ready=none
UIName=NOSTR:WeatherStrikeSW
Name=WeatherStrikeSW

; =============================================================================
; Going past the old file: the storm gets FASTER as it grows, not just denser.
; Drop these into [StormStrikes] to try them.
; =============================================================================
; Recharge.Max=2m                 ; a fresh strike reloads in 2 minutes...
; Recharge.Min=1m                 ; ...and never faster than 1 minute
; Recharge.Shave=0.1s,1           ; 0.1 s off per 1 Weight
; Recharge.Spread=0,1s            ; 0-1 s random extra per reload
; Recharge.Pattern=climb,decline  ; oldest strikes speed up first, then...
; Recharge.Pattern.Switch=motion  ; ...climb pattern while rising, decline while falling
;
; Strike.Count.Add=1,2000         ; one extra cloud per shot per 2000 Weight
; Strike.Count.Max=3
;
; Weight bands -- any key, with the Weight it starts at as the last part:
; Strike.SW.3000=HeavyStrikeSW    ; past level 300 the heavy cloud takes over
; Recharge.Pattern.4000=global    ; past level 400 the whole storm accelerates
;
; Steering the level from events (any warhead / SW / building):
; [WeatherControlSW]
; WeatherSystem.Types=WeatherStorm
; WeatherSystem.Amounts=-500
; WeatherSystem.Motion=decline    ; climb | decline | stable | reverse | keep

; =============================================================================
; Lobby: a Game Options file only needs the keys it changes. Examples:
;   StartingLevel250.ini    ->  [WeatherStorm]  StartAmount=2500
;   MaxLevel100.ini         ->  [WeatherStorm]  Climb.To=1000
;   LowestLevel10.ini       ->  [WeatherStorm]  Decline.To=100
;   DeliverySW_Recharge23   ->  [WeatherStorm]  Climb.Every=23m
;   DecimationSW_Recharge.5 ->  [WeatherStorm]  Decline.Every=0.5m
;   WeatherStrikeSW_Rech.2  ->  [StormStrikes]  Recharge.Max=2m
;   InitialDelay20.ini      ->  [WeatherStorm]  Motion.Delay=20m
;   StartStable.ini         ->  [WeatherStorm]  Motion=stable
; =============================================================================
